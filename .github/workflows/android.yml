# Compila la app de Android (Talleres del Ajolote) y deja un AAB firmado listo para subir a Google Play.
# Se ejecuta a mano: pestaña «Actions» → «Android» → «Run workflow».
# Instrucciones completas: app-android/LEEME.md
name: Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nombre de la versión que verán las familias (por ejemplo 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar los talleres (la app ya lleva todo dentro, sin service worker)
        run: |
          set -euo pipefail
          cd app-android
          rm -rf www && mkdir www
          rsync -a --exclude '.git' --exclude '.github' --exclude 'app-android' --exclude 'herramientas' --exclude 'sw.js' ../ www/
          test -f www/index.html
          grep -q "navigator.serviceWorker.register('sw.js')" www/taller.js
          sed -i "s/navigator.serviceWorker.register('sw.js')/0/" www/taller.js

      - name: Instalar Capacitor y crear el proyecto Android
        run: |
          set -euo pipefail
          cd app-android
          npm install
          npx cap add android

      - name: Íconos y pantalla de arranque
        run: |
          set -euo pipefail
          cd app-android
          npx --yes @capacitor/assets@latest generate --android

      - name: Número y nombre de versión, y sin copia de seguridad automática
        env:
          VN: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          cd app-android/android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${VN}\"/" app/build.gradle
          grep -E "versionCode ${{ github.run_number }}" app/build.gradle || { echo "No se pudo fijar versionCode; revisar app/build.gradle"; cat app/build.gradle; exit 1; }
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' app/src/main/AndroidManifest.xml
          # Fija la app en horizontal (permite girar 180°, sin pasar por vertical)
          sed -i '0,/<activity /s//<activity android:screenOrientation="sensorLandscape" /' app/src/main/AndroidManifest.xml
          grep -q sensorLandscape app/src/main/AndroidManifest.xml || { echo 'No se pudo fijar la orientación'; cat app/src/main/AndroidManifest.xml; exit 1; }

      - name: Sincronizar y compilar
        run: |
          set -euo pipefail
          cd app-android
          npx cap sync android
          cd android
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Firmar el AAB con la llave de subida (si está configurada)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p salida
          AAB=app-android/android/app/build/outputs/bundle/release/app-release.aab
          cp app-android/android/app/build/outputs/apk/debug/app-debug.apk salida/talleres-ajolote-prueba.apk
          if [ -z "${KS_B64:-}" ]; then
            echo "::warning::No hay llave de subida configurada: el AAB queda SIN FIRMAR (no sirve para Google Play). Ver app-android/LEEME.md"
            cp "$AAB" salida/talleres-ajolote-SIN-FIRMAR.aab
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/subida.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/subida.jks" -storepass:env KS_PASS -keypass:env KEY_PASS \
            -signedjar salida/talleres-ajolote.aab "$AAB" "$KEY_ALIAS"
          jarsigner -verify salida/talleres-ajolote.aab
          rm -f "$RUNNER_TEMP/subida.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: talleres-ajolote-android
          path: salida/
          retention-days: 30
