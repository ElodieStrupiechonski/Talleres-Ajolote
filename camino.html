<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f0e3c8"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="author" content="Elodie Strupiechonski"><meta name="author" content="Andrés de Luna Bugallo"><link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
<title>Mi camino · Talleres de Matemáticas</title><meta name="robots" content="noindex"><meta name="description" content="Mi camino por los talleres de matemáticas.">
<link rel="stylesheet" href="taller.css">
<style>.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.who .pu-av{width:84px}.who h1{margin:0}
.big{height:18px;background:#eee6d6;border:3px solid var(--tray-edge);border-radius:12px;overflow:hidden;max-width:560px}.big i{display:block;height:100%;background:#6fae7e}
.sig{display:flex;align-items:center;gap:14px;background:var(--card);border:4px solid var(--fg);border-radius:18px;padding:14px 18px;text-decoration:none;color:var(--fg);font-family:var(--display);font-weight:800;font-size:1.25rem;max-width:640px;min-height:56px}
.sig small{display:block;font-weight:600;font-size:.9rem;color:var(--muted)}.sig b{margin-left:auto;color:var(--red)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{min-height:44px;padding:4px 16px;font:inherit;font-family:var(--display);font-weight:800;border:3px solid var(--tray-edge);border-radius:14px;background:var(--card);color:var(--fg);cursor:pointer}.tabs button.on{background:var(--acc,#f2b8c6);border-color:var(--fg)}
.pasos{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}.pasos li a{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border-radius:12px;background:var(--card);border:3px solid var(--tray-edge);text-decoration:none;color:var(--fg);font-weight:600}
.pasos li.ok a{border-color:#6fae7e}.pasos .m{font-family:var(--display);font-weight:800;width:1.6em;text-align:center;color:#3f7a50}.pasos .m.no{color:var(--muted)}
h2.tm{margin:14px 0 6px;font-size:1.2rem}.nota{color:var(--muted);font-size:.95rem;max-width:70ch}.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-width:760px}
.tema{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;min-height:120px;border:3px solid var(--tray-edge);border-radius:18px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;text-align:center}
.tema .ic{width:52px;height:52px;display:block}.tema .ic svg{width:100%;height:100%}.tema b{font-family:var(--display);font-size:1rem;line-height:1.15}.tema small{color:var(--muted)}
.tema.ok{border-color:#6fae7e}.mini{display:block;width:80%;height:8px;border-radius:6px;background:#eee6d6;overflow:hidden}.mini i{display:block;height:100%;background:#6fae7e}
.elim{margin:22px 0 8px;color:var(--muted)}.elim summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.dng{border-color:#b5483a!important;color:#8a2c20}

.gt{background:var(--card);border:3px solid var(--tray-edge);border-radius:18px;padding:10px 12px;max-width:760px;margin-top:6px}
.gt h2{margin:0 0 6px}.gr{display:flex;align-items:center;gap:8px;min-height:30px}.gl{flex:0 0 clamp(104px,30%,170px);display:flex;align-items:center;gap:6px;font:700 .85rem/1.1 var(--display);min-width:0}
.gl .ic{flex:none;width:24px;height:24px}.gl .ic svg{width:100%;height:100%}.gl span{overflow-wrap:anywhere}
.gtk{position:relative;flex:1;height:20px;border-radius:10px;background:rgba(65,54,43,.08)}
.gc{position:absolute;top:2px;bottom:2px;border-radius:5px;background:#d9c7a5;margin:0 1px}

.gv{position:fixed;inset:0;background:rgba(40,30,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.gvb{background:var(--card,#fff);border:4px solid var(--fg,#41362b);border-radius:20px;padding:20px 24px;max-width:420px;text-align:center}
.gvb h3{margin:0 0 6px;font-size:1.3rem}.gvt{font-size:1.15rem;font-weight:700;margin:0 0 14px}
.gvr{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gvgo,.gvno{font:800 1.1rem var(--display,inherit);padding:12px 22px;border-radius:14px;border:3px solid var(--fg,#41362b);text-decoration:none;cursor:pointer;min-height:48px;box-sizing:border-box}
.gvgo{background:var(--acc);color:var(--acc-fg,#fff)}.gvno{background:#fff;color:var(--fg,#41362b)}
.gc.d{background:linear-gradient(#9bd9aa,#5fa673)}.gc.n{background:var(--acc);box-shadow:0 0 0 2px var(--fg);animation:gtp 1.2s ease-in-out infinite;z-index:2}
@keyframes gtp{50%{transform:scaleY(1.35)}}
.gh{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--red);z-index:1}
.gax{display:flex;align-items:center;gap:8px;margin-top:2px}.gax .gl{visibility:hidden}.gax .gtk{background:none;height:16px}
.gax b{position:absolute;top:0;font:700 .7rem/1 var(--display);color:var(--muted);transform:translateX(-50%)}
.gleg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.85rem;color:var(--muted)}.gleg i{display:inline-block;width:14px;height:10px;border-radius:4px;vertical-align:middle;margin-right:4px}
@media (prefers-reduced-motion:reduce){.gc.n{animation:none}}
@media (max-width:480px){.sig{font-size:1.1rem}.who .pu-av{width:64px}}</style>
</head><body>
<div class="wrap">
  <a class="back" href="index.html">← Todos los talleres</a>
  <header class="who" id="who"></header>
  <div id="cont"></div>
</div>
<script src="ilustra.js"></script><script src="perfiles.js"></script><script src="rutas.js"></script><script src="perfilui.js"></script>
<script>
(function(){
  var cont=document.getElementById('cont'),who=document.getElementById('who'),anio=null,tema=null;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}

  // Plan del año tipo Gantt: una fila por tema, una casilla por paso, en el orden sugerido
  // Al tocar el cuadro azul «Sigue» se propone entrar al taller correspondiente
  function propone(s){
    var v=el('div','gv'),b=el('div','gvb'); v.appendChild(b);
    b.appendChild(el('h3',null,'Tu siguiente paso')); b.appendChild(el('p','gvt',Rutas.etiqueta(s)));
    var r=el('div','gvr'),a=el('a','gvgo','Entrar'); a.href=Rutas.url(s); var n=el('button','gvno','Ahora no'); n.type='button'; n.onclick=function(){v.remove();};
    r.appendChild(a); r.appendChild(n); b.appendChild(r); v.onclick=function(e){if(e.target===v)v.remove();}; document.body.appendChild(v); a.focus();
  }
  function gantt(p,ps){
    var N=ps.length,box=el('div','gt'),g={},ord=[],sigI=-1;
    box.appendChild(el('h2','tm','Mi plan del año'));
    ps.forEach(function(s,i){ if(!g[s.p]){g[s.p]=[];ord.push(s.p);} g[s.p].push(i); if(sigI<0&&!Perf.hecho(p,s.p,s.b,s.l))sigI=i; });
    ord.forEach(function(k){
      var row=el('div','gr'),lab=el('div','gl'),ic=el('span','ic'); if(window.Ilu&&Ilu.titulo('icono_'+k))ic.innerHTML=Ilu.html('icono_'+k); lab.appendChild(ic); lab.appendChild(el('span',null,Rutas.TEMA[k]));
      var tr=el('div','gtk');
      g[k].forEach(function(i){ var s=ps[i],ok=Perf.hecho(p,s.p,s.b,s.l),c=el('div','gc'+(ok?' d':'')+(i===sigI?' n':'')); c.style.left=(100*i/N)+'%'; c.style.width=(100/N)+'%'; c.title=Rutas.etiqueta(s); if(i===sigI){ c.setAttribute('role','button'); c.tabIndex=0; c.style.cursor='pointer'; c.setAttribute('aria-label','Sigue: '+Rutas.etiqueta(s)+'. Tocar para entrar'); (function(s){ var ir=function(){ propone(s); }; c.onclick=ir; c.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();ir();} }; })(s); } tr.appendChild(c); });
      if(sigI>=0){ var h=el('i','gh'); h.style.left=(100*sigI/N)+'%'; tr.appendChild(h); }
      row.appendChild(lab); row.appendChild(tr); box.appendChild(row); });
    var ax=el('div','gax'),al=el('div','gl'),at=el('div','gtk'); [1,10,20,30].forEach(function(n){ if(n<=N){ var b=el('b',null,String(n)); b.style.left=(100*(n-.5)/N)+'%'; at.appendChild(b); } }); ax.appendChild(al); ax.appendChild(at); box.appendChild(ax);
    // Zona táctil amplia: tocar en la columna del paso que sigue (en cualquier fila, a ±22 px) también propone entrar
    if(sigI>=0){ box.addEventListener('click',function(e){ if(e.target.closest('.gc.n'))return; var q=box.querySelector('.gc.n'); if(!q)return; var r=q.getBoundingClientRect(); if(!e.target.closest('.gtk'))return; var cx=r.left+r.width/2; if(Math.abs(e.clientX-cx)<=22) propone(ps[sigI]); }); }
    var lg=el('div','gleg'); lg.innerHTML='<span><i style="background:#5fa673"></i>Hecho</span><span><i style="background:var(--acc)"></i>Sigue</span><span><i style="background:#d9c7a5"></i>Falta</span><span>Pasos del año: 1 a '+N+'</span>'; box.appendChild(lg);
    if(sigI>=0){ var go=el('button','gsig','Entrar a mi siguiente paso →'); go.type='button'; go.onclick=function(){ propone(ps[sigI]); }; box.appendChild(go); }
    return box;
  }
  function pinta(){
    var p=Perf.activo(); who.innerHTML=''; cont.innerHTML='';
    if(!p){who.appendChild(el('h1',null,'Mi camino')); var b=el('button','pu-go','Elegir quién soy'); b.type='button'; b.onclick=function(){PerfUI.elegir(pinta);}; cont.appendChild(el('p','lead','Elige tu perfil para ver tus pasos.')); cont.appendChild(b); return;}
    who.appendChild(PerfUI.avatar(p)); var h=el('div'); h.appendChild(el('h1',null,p.nombre)); h.appendChild(el('p','nota','Taller '+p.taller+' · año '+p.anio)); who.appendChild(h);
    var cam=el('button','pu-sec','Cambiar de perfil'); cam.type='button'; cam.onclick=function(){PerfUI.elegir(function(){anio=null;tema=null;pinta();});}; who.appendChild(cam);
    if(anio==null)anio=p.anio;
    var est=Rutas.estado(p);
    // 1) lo siguiente, grande y solo
    if(est.sig){var a=el('a','sig'); a.href=Rutas.url(est.sig); var t=el('span'); t.appendChild(document.createTextNode(Rutas.etiqueta(est.sig))); var sm=el('small',null,{sigue:'Tu siguiente paso',repaso:'Un repaso para ir con calma',reto:'Un reto para ti','año':''}[est.motivo]); t.appendChild(sm); a.appendChild(t); a.appendChild(el('b',null,'Ir →')); cont.appendChild(a);}
    else cont.appendChild(el('p','lead','¡Terminaste todos los pasos de este año! Pregunta a tu guía por el siguiente.'));
    var bg=el('div','big'),fl=el('i'); fl.style.width=(est.total?100*est.hechos/est.total:0)+'%'; bg.appendChild(fl); cont.appendChild(bg);
    cont.appendChild(el('p','nota',est.hechos+' de '+est.total+' pasos de mi año '+p.anio));
    // 2) año (chips pequeños)
    var tabs=el('div','tabs'); tabs.setAttribute('role','group'); tabs.setAttribute('aria-label','Año');
    [1,2,3].forEach(function(n){var b=el('button',n===anio?'on':'','Año '+n); b.type='button'; b.onclick=function(){anio=n;tema=null;pinta();}; tabs.appendChild(b);}); cont.appendChild(tabs);
    var T=Rutas.TALLER[p.taller]; if(T.nota)cont.appendChild(el('p','nota',T.nota));
    var ps=Rutas.pasos(p.taller,anio);
    if(!ps.length){cont.appendChild(el('p','nota','Todavía no hay pasos para este año.')); borra(p); return;}
    if(!tema)cont.appendChild(gantt(p,ps));
    // 3) mapa de temas; solo al elegir uno se ven sus pasos
    var g={},ord=[]; ps.forEach(function(s){ if(!g[s.p]){g[s.p]=[];ord.push(s.p);} g[s.p].push(s); });
    if(tema&&!g[tema])tema=null;
    if(!tema){
      cont.appendChild(el('h2','tm','Mis temas'));
      var grid=el('div','temas');
      ord.forEach(function(k){var n=g[k].filter(function(s){return Perf.hecho(p,s.p,s.b,s.l);}).length,tot=g[k].length;
        var c=el('button','tema'+(n===tot?' ok':'')); c.type='button';
        var ic=el('span','ic'); if(window.Ilu&&Ilu.titulo('icono_'+k))ic.innerHTML=Ilu.html('icono_'+k); else ic.textContent='★'; c.appendChild(ic);
        c.appendChild(el('b',null,Rutas.TEMA[k])); c.appendChild(el('small',null,n===tot?'¡Completo!':n+' de '+tot));
        var m=el('i','mini'),f2=el('i'); f2.style.width=(100*n/tot)+'%'; m.appendChild(f2); c.appendChild(m);
        c.onclick=function(){tema=k;pinta();window.scrollTo(0,0);}; grid.appendChild(c);});
      cont.appendChild(grid);
    } else {
      var bk=el('button','pu-sec','← Mis temas'); bk.type='button'; bk.onclick=function(){tema=null;pinta();}; cont.appendChild(bk);
      cont.appendChild(el('h2','tm',Rutas.TEMA[tema]));
      var ul=el('ul','pasos');
      g[tema].forEach(function(s){var ok=Perf.hecho(p,s.p,s.b,s.l),li=el('li',ok?'ok':''),a=el('a'); a.href=Rutas.url(s);
        a.appendChild(el('span','m'+(ok?'':' no'),ok?'★':'○'));
        a.appendChild(el('span',null,(Rutas.EST[s.p][s.b-1][0])+(s.l?' · nivel '+s.l:'')+(s.pre&&!ok?' · calentamiento':''))); li.appendChild(a); ul.appendChild(li);});
      cont.appendChild(ul);
    }
    borra(p);
  }
  // Eliminar el perfil: con confirmación; si el adulto puso un número secreto, se hace desde el Diario
  function borra(p){
    var d=el('details','elim'); d.appendChild(el('summary',null,'Eliminar este perfil'));
    if(Perf.tienePin()&&!Perf.abierto()){ var a=el('a',null,'Pide a tu guía que lo elimine desde el Diario'); a.href='diario.html'; d.appendChild(el('p','nota','Este dispositivo tiene un número secreto de adulto.')); d.appendChild(a); }
    else { d.appendChild(el('p','nota','Se borran el nombre, el ajolote y todo el avance de '+p.nombre+' de este dispositivo. No se puede deshacer.'));
      var b=el('button','pu-sec dng','Eliminar el perfil de '+p.nombre); b.type='button';
      b.onclick=function(){ if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='¿Seguro? Toca otra vez para eliminar';return;} Perf.borrar(p.id); anio=null;tema=null; pinta(); };
      d.appendChild(b); }
    cont.appendChild(d);
  }
  pinta();
})();
</script>
<script src="taller.js"></script>
</body></html>
